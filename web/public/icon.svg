      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Monogram 9X - Stylized Edgy Geometry -->
